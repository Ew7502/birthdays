<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friends' Birthday Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { max-width: 800px; width: 100%; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 { margin: 0; }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #334155; }
    .btn-danger { background: #ef4444; }

    /* Hero Card */
    .hero-card {
      background: linear-gradient(135deg, #6366f1, var(--accent));
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      margin-bottom: 2rem;
      cursor: pointer;
    }
    .hero-card h2 { margin: 0 0 0.5rem 0; font-size: 1.1rem; opacity: 0.9; }
    .hero-card .name { font-size: 2.2rem; font-weight: bold; margin: 0.5rem 0; }
    .hero-card .days-left { font-size: 1rem; background: rgba(255,255,255,0.2); padding: 0.4rem 1rem; border-radius: 2rem; display: inline-block; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header { font-weight: bold; font-size: 1.2rem; margin-bottom: 0.25rem; }
    .card-date { color: var(--subtext); font-size: 0.9rem; }
    .card-notes { font-size: 0.85rem; color: #cbd5e1; margin: 0.75rem 0; font-style: italic; }
    
    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .card-actions button {
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }

    /* Fixed Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-overlay.active {
      display: flex !important;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 0.75rem;
      width: 90%;
      max-width: 400px;
      border: 1px solid #334155;
    }
    .modal-content h3 { margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--subtext); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid #334155;
      color: white;
      border-radius: 0.4rem;
      box-sizing: border-box;
    }

    .controls { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎈 Birthday Hub</h1>
      <button class="btn" id="addBtn">+ Add Friend</button>
    </header>

    <div class="hero-card" id="hero">
      <h2>🎉 NEXT BIRTHDAY</h2>
      <div class="name" id="hero-name">No Birthdays Added</div>
      <div class="days-left" id="hero-days">---</div>
    </div>

    <h2>All Upcoming Birthdays</h2>
    <div class="grid" id="friends-grid"></div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 2rem 0;">
    <div class="controls">
      <button class="btn btn-secondary" onclick="exportData()">💾 Export Backup</button>
      <button class="btn btn-secondary" onclick="importData()">📂 Import Backup</button>
    </div>
  </div>

  <div class="modal-overlay" id="friendModal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Friend</h3>
      <input type="hidden" id="editIndex" value="-1">
      
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="friendName" placeholder="Alex" required>
      </div>
      <div class="form-group">
        <label>Birthday (MM-DD)</label>
        <input type="text" id="friendDate" placeholder="04-15" pattern="\d{2}-\d{2}" required>
      </div>
      <div class="form-group">
        <label>Notes / Gift Ideas</label>
        <textarea id="friendNotes" rows="3" placeholder="Loves coffee & board games"></textarea>
      </div>

      <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
        <button class="btn" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Default data
    const defaultFriends = [
      { name: "Alex", date: "04-15", notes: "Loves board games & dark roast coffee" },
      { name: "Sam", date: "09-02", notes: "Wants a new mechanical keyboard" }
    ];

    let friends = JSON.parse(localStorage.getItem('birthday_data')) || defaultFriends;

    function saveToStorage() {
      localStorage.setItem('birthday_data', JSON.stringify(friends));
      render();
    }

    function getDaysUntil(dateStr) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const [month, day] = dateStr.split('-').map(Number);
      let nextBday = new Date(currentYear, month - 1, day);
      now.setHours(0, 0, 0, 0);

      if (nextBday < now) nextBday.setFullYear(currentYear + 1);
      const diffTime = nextBday - now;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function render() {
      const grid = document.getElementById('friends-grid');
      grid.innerHTML = '';

      if (friends.length === 0) {
        document.getElementById('hero-name').textContent = "No Birthdays";
        document.getElementById('hero-days').textContent = "Add someone to get started!";
        return;
      }

      friends.sort((a, b) => getDaysUntil(a.date) - getDaysUntil(b.date));

      const nextFriend = friends[0];
      const daysLeft = getDaysUntil(nextFriend.date);
      document.getElementById('hero-name').textContent = nextFriend.name;
      document.getElementById('hero-days').textContent = daysLeft === 0 
        ? "🎂 TODAY IS THEIR BIRTHDAY! 🎉" 
        : `In ${daysLeft} day${daysLeft === 1 ? '' : 's'}`;

      friends.forEach((friend, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        const days = getDaysUntil(friend.date);
        const dayText = days === 0 ? "🎉 TODAY!" : `In ${days} days`;

        card.innerHTML = `
          <div>
            <div class="card-header">${friend.name}</div>
            <div class="card-date">Date: ${friend.date} • <strong>${dayText}</strong></div>
            <div class="card-notes">"${friend.notes || 'No notes added'}"</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-secondary" onclick="editFriend(${index})">✏️ Edit</button>
            <button class="btn btn-danger" onclick="deleteFriend(${index})">🗑️ Delete</button>
            <button class="btn" style="padding: 0.3rem 0.6rem;" onclick="triggerConfetti()">🎉</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Modal Event Controls
    const modal = document.getElementById('friendModal');
    const addBtn = document.getElementById('addBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const saveBtn = document.getElementById('saveBtn');

    addBtn.addEventListener('click', () => openModal());
    cancelBtn.addEventListener('click', () => closeModal());
    saveBtn.addEventListener('click', () => saveFriend());

    function openModal(editIdx = -1) {
      document.getElementById('editIndex').value = editIdx;
      if (editIdx >= 0) {
        document.getElementById('modalTitle').textContent = "Edit Friend";
        document.getElementById('friendName').value = friends[editIdx].name;
        document.getElementById('friendDate').value = friends[editIdx].date;
        document.getElementById('friendNotes').value = friends[editIdx].notes || "";
      } else {
        document.getElementById('modalTitle').textContent = "Add Friend";
        document.getElementById('friendName').value = "";
        document.getElementById('friendDate').value = "";
        document.getElementById('friendNotes').value = "";
      }
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    function saveFriend() {
      const name = document.getElementById('friendName').value.trim();
      const date = document.getElementById('friendDate').value.trim();
      const notes = document.getElementById('friendNotes').value.trim();
      const editIdx = parseInt(document.getElementById('editIndex').value);

      if (!name || !date.match(/^\d{2}-\d{2}$/)) {
        alert("Please enter a valid Name and Date in MM-DD format (e.g., 05-21)");
        return;
      }

      if (editIdx >= 0) {
        friends[editIdx] = { name, date, notes };
      } else {
        friends.push({ name, date, notes });
      }

      saveToStorage();
      closeModal();
    }

    function editFriend(index) { openModal(index); }

    function deleteFriend(index) {
      if (confirm(`Remove ${friends[index].name} from your list?`)) {
        friends.splice(index, 1);
        saveToStorage();
      }
    }

    function triggerConfetti() {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }

    document.getElementById('hero').addEventListener('click', triggerConfetti);

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(friends));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "birthdays_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      const json = prompt("Paste your backup JSON data here:");
      if (json) {
        try {
          const parsed = JSON.parse(json);
          if (Array.isArray(parsed)) {
            friends = parsed;
            saveToStorage();
            alert("Birthdays imported successfully!");
          }
        } catch(e) {
          alert("Invalid JSON data format.");
        }
      }
    }

    render();
  </script>
</body>
</html>
