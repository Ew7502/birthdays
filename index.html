<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Friends' Birthday Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #8b5cf6;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { max-width: 800px; width: 100%; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 { margin: 0; }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #334155; }
    .btn-danger { background: #ef4444; }

    /* Hero Card */
    .hero-card {
      background: linear-gradient(135deg, #6366f1, var(--accent));
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      margin-bottom: 2rem;
      cursor: pointer;
    }
    .hero-card h2 { margin: 0 0 0.5rem 0; font-size: 1.1rem; opacity: 0.9; }
    .hero-card .name { font-size: 2.2rem; font-weight: bold; margin: 0.5rem 0; }
    .hero-card .days-left { font-size: 1rem; background: rgba(255,255,255,0.2); padding: 0.4rem 1rem; border-radius: 2rem; display: inline-block; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: 0.75rem;
      border: 1px solid #334155;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header { font-weight: bold; font-size: 1.2rem; margin-bottom: 0.25rem; }
    .card-date { color: var(--subtext); font-size: 0.9rem; }
    .card-notes { font-size: 0.85rem; color: #cbd5e1; margin: 0.75rem 0; font-style: italic; }
    
    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .card-actions button {
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 0.75rem;
      width: 90%;
      max-width: 400px;
      border: 1px solid #334155;
    }
    .modal-content h3 { margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--subtext); }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid #334155;
      color: white;
      border-radius: 0.4rem;
      box-sizing: border-box;
    }

    .controls { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎈 Birthday Hub</h1>
      <button class="btn" onclick="openModal()">+ Add Friend</button>
    </header>

    <div class="hero-card" id="hero">
      <h2>🎉 NEXT BIRTHDAY</h2>
      <div class="name" id="hero-name">No Birthdays Added</div>
      <div class="days-left" id="hero-days">---</div>
    </div>

    <h2>All Upcoming Birthdays</h2>
    <div class="grid" id="friends-grid"></div>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 2rem 0;">
    <div class="controls">
      <button class="btn btn-secondary" onclick="exportData()">💾 Export Backup</button>
      <button class="btn btn-secondary" onclick="importData()">📂 Import Backup</button>
    </div>
  </div>

  <div class="modal" id="friendModal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Friend</h3>
      <input type="hidden" id="editIndex" value="-1">
      
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="friendName" placeholder="Alex" required>
      </div>

        <label>Birthday (MM-DD)</label>
        <input type
